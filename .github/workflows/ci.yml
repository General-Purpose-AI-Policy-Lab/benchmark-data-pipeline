name: ci

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv venv --python 3.11 .venv && uv pip install --python .venv/bin/python -e . --group dev
      - run: .venv/bin/ruff check .
      # The golden and parity tests skip here: Scale's pages are not redistributed, so no build
      # runs on a fresh checkout. They run in the `refresh` workflow, which fetches the feeds.
      - run: .venv/bin/pytest -q
